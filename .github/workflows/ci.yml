name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: inference
          POSTGRES_DB: inference_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inference -d inference_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python scripts/train_model.py

      - name: Lint
        run: ruff check app tests scripts

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://inference:inference@localhost:5432/inference_test
          TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t inference-api:ci .

  smoke:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Start stack and smoke test
        run: |
          docker compose up -d --wait
          curl -sf http://localhost:8000/health | grep -q healthy
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}' \
            | grep -q prediction
          docker compose down -v
