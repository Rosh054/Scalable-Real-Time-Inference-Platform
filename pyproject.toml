[project]
name = "scalable-real-time-inference-platform"
version = "1.0.0"
description = "Production-style FastAPI ML inference service with Redis caching and PostgreSQL logging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
